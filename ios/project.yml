# XcodeGen spec for the Sonar Reps iPhone app.
#   cd ios && xcodegen generate && open SonarReps.xcodeproj
name: SonarReps
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SonarReps:
    type: application
    platform: iOS
    sources:
      - SonarRepsApp.swift
      - SonarEngine.swift
      - SonarSession.swift
      # Every screen lives in UI/. New files there are picked up by xcodegen.
      - UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adityamitter.sonarreps
        DEVELOPMENT_TEAM: 96NZ2LL5TG
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sonar Reps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Sonar listens for echoes of the tone it plays.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Streams sonar samples to your Mac.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Shows saved takes in the Files app, a second way to get them off the phone.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
